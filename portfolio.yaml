apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: 192.168.68.63:5000/portfolio:latest
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2048Mi"
              cpu: "2000m"
          envFrom:
            - secretRef:
                name: portfolio
          ports:
            - containerPort: 5006
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
  namespace: default
spec:
  type: NodePort
  selector:
    app: portfolio
  ports:
    - name: api
      port: 5006
      targetPort: 5006
      nodePort: 30008
