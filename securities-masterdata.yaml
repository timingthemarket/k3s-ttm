apiVersion: apps/v1
kind: Deployment
metadata:
  name: securities-masterdata
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securities-masterdata
  template:
    metadata:
      labels:
        app: securities-masterdata
    spec:
      containers:
        - name: securities-masterdata
          image: 192.168.68.63:5000/securities-masterdata:latest
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
          envFrom:
            - secretRef:
                name: securities-masterdata
          ports:
            - containerPort: 5001
            - containerPort: 5101
---
apiVersion: v1
kind: Service
metadata:
  name: securities-masterdata
  namespace: default
spec:
  type: NodePort
  selector:
    app: securities-masterdata
  ports:
    - name: api
      port: 5001
      targetPort: 5001
      nodePort: 30003
    - name: secondary
      port: 5101
      targetPort: 5101
      nodePort: 30004
